<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="jr-title">
  <title id="jr-title">John Rylands Research Institute and Library Gothic facade</title>
  <rect width="600" height="400" fill="#1E293B"/>
  <rect y="330" width="600" height="70" fill="#334155"/>
  <!-- Sandstone Gothic Facade -->
  <rect x="100" y="130" width="400" height="200" fill="#9B4D3A"/>
  <polygon points="100,130 140,70 180,130" fill="#7F392A"/>
  <polygon points="420,130 460,70 500,130" fill="#7F392A"/>
  <polygon points="220,130 300,45 380,130" fill="#8C3F2E"/>
  <!-- Lancet Windows -->
  <path d="M145 290 V195 Q165 155 185 195 V290 Z" fill="#FDE68A" opacity="0.9"/>
  <path d="M415 290 V195 Q435 155 455 195 V290 Z" fill="#FDE68A" opacity="0.9"/>
  <!-- Great Central Gothic Window -->
  <path d="M240 270 V175 Q300 110 360 175 V270 Z" fill="#F4B41A" opacity="0.92"/>
  <line x1="270" y1="145" x2="270" y2="270" stroke="#7F392A" stroke-width="4"/>
  <line x1="300" y1="130" x2="300" y2="270" stroke="#7F392A" stroke-width="5"/>
  <line x1="330" y1="145" x2="330" y2="270" stroke="#7F392A" stroke-width="4"/>
  <circle cx="300" cy="175" r="16" fill="none" stroke="#7F392A" stroke-width="4"/>
  <!-- Entrance Arch -->
  <path d="M265 330 V290 Q300 265 335 290 V330 Z" fill="#1E1B18"/>
</svg>
