<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="nq-title">
  <title id="nq-title">Northern Quarter Victorian brick terraces and colourful street art</title>
  <rect width="600" height="400" fill="#232931"/>
  <rect y="330" width="600" height="70" fill="#393E46"/>
  <!-- Left Terraced Building -->
  <rect x="50" y="105" width="165" height="225" fill="#8D2B24"/>
  <rect x="65" y="255" width="135" height="75" fill="#1F2937"/>
  <rect x="80" y="135" width="38" height="48" fill="#FDE68A"/>
  <rect x="142" y="135" width="38" height="48" fill="#FDE68A"/>
  <!-- Centre Mural Building -->
  <rect x="215" y="85" width="175" height="245" fill="#374151"/>
  <circle cx="302" cy="175" r="52" fill="#F4B41A"/>
  <polygon points="270,205 302,135 334,205" fill="#9B2226"/>
  <rect x="240" y="260" width="125" height="70" fill="#0F766E"/>
  <!-- Right Building -->
  <rect x="390" y="120" width="160" height="210" fill="#A1432A"/>
  <rect x="415" y="148" width="42" height="52" fill="#F8FAFC" opacity="0.88"/>
  <rect x="482" y="148" width="42" height="52" fill="#F8FAFC" opacity="0.88"/>
  <rect x="410" y="255" width="120" height="75" fill="#F4B41A"/>
  <text x="470" y="298" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="18" fill="#131820">NQ VINTAGE</text>
</svg>
