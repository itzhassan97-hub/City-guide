<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="lowry-title">
  <title id="lowry-title">The Lowry waterfront theatre and Salford Quays footbridge</title>
  <rect width="600" height="300" fill="#172554"/>
  <rect y="300" width="600" height="100" fill="#0F172A"/>
  <!-- Contemporary Metallic & Glass Arts Complex -->
  <polygon points="85,295 160,120 265,295" fill="#94A3B8"/>
  <polygon points="180,295 290,95 405,295" fill="#64748B"/>
  <rect x="360" y="155" width="145" height="140" fill="#334155"/>
  <rect x="380" y="175" width="105" height="90" fill="#F4B41A" opacity="0.82"/>
  <polygon points="245,295 290,175 335,295" fill="#9B2226"/>
  <!-- Quays Footbridge Arch -->
  <path d="M55 300 Q300 200 545 300" fill="none" stroke="#E2E8F0" stroke-width="6"/>
  <line x1="180" y1="262" x2="180" y2="300" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="300" y1="250" x2="300" y2="300" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="420" y1="262" x2="420" y2="300" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Water Ripples -->
  <line x1="140" y1="335" x2="260" y2="335" stroke="#F4B41A" stroke-width="3" opacity="0.6"/>
  <line x1="350" y1="360" x2="490" y2="360" stroke="#94A3B8" stroke-width="2" opacity="0.5"/>
</svg>
