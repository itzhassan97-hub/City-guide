<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="sim-title">
  <title id="sim-title">Science and Industry Museum historic railway warehouse and steam wheel</title>
  <rect width="600" height="400" fill="#1C2836"/>
  <rect y="325" width="600" height="75" fill="#2A3441"/>
  <!-- Red Brick Warehouse -->
  <rect x="65" y="130" width="470" height="195" fill="#9B2226"/>
  <polygon points="55,130 300,72 545,130" fill="#641220"/>
  <!-- Clerestory Windows -->
  <rect x="105" y="160" width="55" height="65" rx="4" fill="#F8FAFC" opacity="0.85"/>
  <rect x="195" y="160" width="55" height="65" rx="4" fill="#F8FAFC" opacity="0.85"/>
  <rect x="350" y="160" width="55" height="65" rx="4" fill="#F8FAFC" opacity="0.85"/>
  <rect x="440" y="160" width="55" height="65" rx="4" fill="#F8FAFC" opacity="0.85"/>
  <!-- Steam Gear / Locomotive Wheel Emblem -->
  <circle cx="300" cy="245" r="56" fill="#131820" stroke="#F4B41A" stroke-width="8"/>
  <circle cx="300" cy="245" r="14" fill="#F4B41A"/>
  <line x1="300" y1="189" x2="300" y2="301" stroke="#F4B41A" stroke-width="5"/>
  <line x1="244" y1="245" x2="356" y2="245" stroke="#F4B41A" stroke-width="5"/>
  <line x1="260" y1="205" x2="340" y2="285" stroke="#F4B41A" stroke-width="4"/>
  <line x1="340" y1="205" x2="260" y2="285" stroke="#F4B41A" stroke-width="4"/>
</svg>
