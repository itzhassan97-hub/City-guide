<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="hp-title">
  <title id="hp-title">Heaton Park neoclassical hall, rolling parkland, and boating lake</title>
  <rect width="600" height="400" fill="#1E3A5F"/>
  <circle cx="480" cy="85" r="36" fill="#F4B41A" opacity="0.9"/>
  <!-- Rolling Hills -->
  <path d="M0 280 Q150 220 320 265 T600 250 V400 H0 Z" fill="#2D6A4F"/>
  <path d="M0 315 Q220 285 410 315 T600 305 V400 H0 Z" fill="#1B4332"/>
  <!-- Heaton Hall -->
  <rect x="190" y="165" width="220" height="82" fill="#E5E0D8"/>
  <polygon points="245,165 300,130 355,165" fill="#CBD5E1"/>
  <rect x="260" y="165" width="12" height="82" fill="#FAF8F5"/>
  <rect x="294" y="165" width="12" height="82" fill="#FAF8F5"/>
  <rect x="328" y="165" width="12" height="82" fill="#FAF8F5"/>
  <!-- Trees -->
  <circle cx="95" cy="235" r="38" fill="#40916C"/>
  <circle cx="135" cy="245" r="28" fill="#52B788"/>
  <circle cx="505" cy="230" r="40" fill="#40916C"/>
  <!-- Lake -->
